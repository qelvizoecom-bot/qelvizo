<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Install QELVIZO App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 22px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border-radius: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    #installBtn {
      display: none;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      margin-top: 20px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .openBtn {
      display: block;
      width: 100%;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
      background: #eee;
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      class="logo"
      src="/qelvizo-owner-icon-192.png"
      alt="QELVIZO">

    <h1>QELVIZO</h1>

    <p>
      Shop QELVIZO products directly from your phone.
    </p>

    <button id="installBtn">
      📲 Install QELVIZO App
    </button>

    <a
      class="openBtn"
      href="https://qelvizo-shop.pages.dev/">
      Open QELVIZO Shop
    </a>

    <div class="note">
      Install option will appear when supported by your browser.
    </div>

  </div>

  <script>
    let deferredPrompt;

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;

      const installBtn = document.getElementById("installBtn");
      installBtn.style.display = "block";

      installBtn.onclick = async () => {
        installBtn.style.display = "none";

        deferredPrompt.prompt();

        await deferredPrompt.userChoice;

        deferredPrompt = null;
      };
    });
  </script>

</body>
</html>
