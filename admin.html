<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QELVIZO Owner Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f4;
  color:#17251c;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
  border-radius:8px;
  padding:11px 15px;
  font-weight:bold;
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#123522;
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 40px rgba(0,0,0,.2);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  color:#174d30;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

input,textarea{
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border:1px solid #d8d8d8;
  border-radius:8px;
  outline:none;
}

input:focus,textarea:focus{
  border-color:#174d30;
}

.login-btn,
.save-btn{
  width:100%;
  background:#174d30;
  color:white;
}

.message{
  margin-top:12px;
  text-align:center;
  font-size:14px;
  min-height:20px;
}

.error{
  color:#c00000;
}

.success{
  color:#087a35;
}

#app{
  display:none;
}

header{
  background:#123522;
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

main{
  max-width:950px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:12px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:25px;
  color:#174d30;
}

.product{
  border:1px solid #ddd;
  padding:14px;
  border-radius:12px;
  margin:12px 0;
  display:flex;
  gap:14px;
  align-items:center;
}

.product img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
}

.info{
  flex:1;
}

.info b{
  font-size:17px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.edit{
  background:#e7efff;
  color:#1450a0;
}

.delete{
  background:#ffe7e7;
  color:#b00020;
}

.toggle{
  background:#eee;
}

.logout{
  background:white;
  color:#123522;
}

.cancel{
  background:#eee;
  width:100%;
  margin-top:8px;
}

.status{
  font-size:13px;
  margin-top:5px;
}

.on{
  color:#087a35;
}

.off{
  color:#b00020;
}

@media(max-width:650px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .product{
    align-items:flex-start;
  }

  .product img{
    width:65px;
    height:65px;
  }

  .actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">

  <div class="login-box">

    <div class="logo">QELVIZO</div>

    <div class="subtitle">Owner Admin Panel</div>

    <input
      id="email"
      type="email"
      placeholder="Owner Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn" class="login-btn">
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- ADMIN APP -->
<div id="app">

  <header>

    <div>
      <b>QELVIZO OWNER</b>
    </div>

    <button id="logoutBtn" class="logout">
      Logout
    </button>

  </header>


  <main>

    <!-- STATS -->
    <div class="stats">

      <div class="stat">
        <b id="productCount">0</b>
        Products
      </div>

      <div class="stat">
        <b id="stockCount">0</b>
        Stock
      </div>

      <div class="stat">
        <b id="activeCount">0</b>
        Active
      </div>

    </div>


    <!-- ADD / EDIT -->
    <div class="card">

      <h2 id="formTitle">Add Product</h2>

      <input
        id="name"
        type="text"
        placeholder="Product Name"
      >

      <input
        id="price"
        type="number"
        min="0"
        placeholder="Selling Price"
      >

      <input
        id="mrp"
        type="number"
        min="0"
        placeholder="MRP"
      >

      <input
        id="stock"
        type="number"
        min="0"
        placeholder="Stock Quantity"
      >

      <input
        id="image"
        type="url"
        placeholder="Product Image URL"
      >

      <textarea
        id="description"
        rows="4"
        placeholder="Product Description"
      ></textarea>

      <button id="saveBtn" class="save-btn">
        Add Product
      </button>

      <button
        id="cancelBtn"
        class="cancel"
        style="display:none;"
      >
        Cancel Edit
      </button>

      <div id="formMessage" class="message"></div>

    </div>


    <!-- PRODUCTS -->
    <div class="card">

      <h2>My Products</h2>

      <div id="products">
        Loading products...
      </div>

    </div>

  </main>

</div>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://oogibbmsiiarceczqgfa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VLedtJ2r9K4fC00T4k8CgA_ahfpM1dh";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let editId = null;


/* =========================
   ELEMENTS
========================= */

const loginPage =
document.getElementById("loginPage");

const app =
document.getElementById("app");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const loginMessage =
document.getElementById("loginMessage");

const formMessage =
document.getElementById("formMessage");

const productsBox =
document.getElementById("products");


/* =========================
   MESSAGE
========================= */

function showLoginMessage(message,isError=true){

  loginMessage.textContent = message;

  loginMessage.className =
    isError
    ? "message error"
    : "message success";
}


function showFormMessage(message,isError=false){

  formMessage.textContent = message;

  formMessage.className =
    isError
    ? "message error"
    : "message success";
}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value;

  if(!email || !password){

    showLoginMessage(
      "Email and password enter karein."
    );

    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  showLoginMessage(
    "Please wait...",
    false
  );

  try{

    const result =
      await db.auth.signInWithPassword({
        email: email,
        password: password
      });

    if(result.error){

      showLoginMessage(
        result.error.message
      );

      return;
    }

    if(!result.data.session){

      showLoginMessage(
        "Login session create nahi hui."
      );

      return;
    }

    loginPage.style.display = "none";
    app.style.display = "block";

    showLoginMessage("",false);

    await loadProducts();

  }catch(error){

    showLoginMessage(
      error.message || "Login failed."
    );

  }finally{

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await db.auth.signOut();

  app.style.display = "none";
  loginPage.style.display = "flex";

  document.getElementById("email").value = "";
  document.getElementById("password").value = "";

  showLoginMessage(
    "Logged out.",
    false
  );

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  productsBox.textContent =
    "Loading products...";

  try{

    const result =
      await db
      .from("products")
      .select("*")
      .order("name");

    if(result.error){

      productsBox.innerHTML =
        "<p class='error'>" +
        escapeHtml(result.error.message) +
        "</p>";

      return;
    }

    const data = result.data || [];

    updateStats(data);

    if(data.length === 0){

      productsBox.innerHTML =
        "<p>No products yet. Add your first product above.</p>";

      return;
    }

    productsBox.innerHTML = "";

    data.forEach(function(product){

      const div =
        document.createElement("div");

      div.className = "product";

      const image =
        product.image_url ||
        "https://via.placeholder.com/80";

      div.innerHTML = `

        <img
          src="${escapeAttribute(image)}"
          onerror="this.src='https://via.placeholder.com/80'"
        >

        <div class="info">

          <b>
            ${escapeHtml(product.name)}
          </b>

          <br>

          Price:
          ₹${Number(product.price || 0)}

          <br>

          MRP:
          ₹${Number(product.mrp || 0)}

          <br>

          Stock:
          ${Number(product.stock || 0)}

          <div class="status ${
            product.is_active ? "on" : "off"
          }">

            Status:
            ${product.is_active ? "ON" : "OFF"}

          </div>

        </div>

        <div class="actions">

          <button
            class="edit"
            data-action="edit"
            data-id="${product.id}"
          >
            Edit
          </button>

          <button
            class="toggle"
            data-action="toggle"
            data-id="${product.id}"
            data-status="${product.is_active}"
          >
            ${product.is_active ? "OFF" : "ON"}
          </button>

          <button
            class="delete"
            data-action="delete"
            data-id="${product.id}"
          >
            Delete
          </button>

        </div>
      `;

      productsBox.appendChild(div);

    });


    /* BUTTON EVENTS */

    productsBox
      .querySelectorAll("[data-action]")
      .forEach(function(button){

        button.addEventListener(
          "click",
          function(){

            const action =
              button.dataset.action;

            const id =
              button.dataset.id;

            if(action === "edit"){
              editProduct(id);
            }

            if(action === "toggle"){
              toggleProduct(
                id,
                button.dataset.status === "true"
              );
            }

            if(action === "delete"){
              deleteProduct(id);
            }

          }
        );

      });


  }catch(error){

    productsBox.innerHTML =
      "<p class='error'>" +
      escapeHtml(error.message) +
      "</p>";

  }

}


/* =========================
   STATS
========================= */

function updateStats(products){

  document.getElementById(
    "productCount"
  ).textContent =
    products.length;

  document.getElementById(
    "stockCount"
  ).textContent =
    products.reduce(
      function(total,p){
        return total + Number(p.stock || 0);
      },
      0
    );

  document.getElementById(
    "activeCount"
  ).textContent =
    products.filter(
      function(p){
        return p.is_active;
      }
    ).length;

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

  const name =
    document.getElementById("name")
    .value
    .trim();

  const price =
    Number(
      document.getElementById("price")
      .value || 0
    );

  const mrp =
    Number(
      document.getElementById("mrp")
      .value || 0
    );

  const stock =
    Number(
      document.getElementById("stock")
      .value || 0
    );

  const image =
    document.getElementById("image")
    .value
    .trim();

  const description =
    document.getElementById("description")
    .value
    .trim();


  if(!name){

    showFormMessage(
      "Product name enter karein.",
      true
    );

    return;
  }


  const product = {

    name: name,

    price: price,

    mrp: mrp,

    stock: stock,

    image_url: image,

    description: description

  };


  const saveBtn =
    document.getElementById("saveBtn");

  saveBtn.disabled = true;

  saveBtn.textContent =
    editId
    ? "Updating..."
    : "Adding...";


  try{

    let result;

    if(editId){

      result =
        await db
        .from("products")
        .update(product)
        .eq("id",editId);

    }else{

      result =
        await db
        .from("products")
        .insert(product);

    }


    if(result.error){

      showFormMessage(
        result.error.message,
        true
      );

      return;
    }


    showFormMessage(
      editId
      ? "Product updated successfully."
      : "Product added successfully.",
      false
    );


    clearForm();

    await loadProducts();


  }catch(error){

    showFormMessage(
      error.message,
      true
    );

  }finally{

    saveBtn.disabled = false;

    saveBtn.textContent =
      editId
      ? "Update Product"
      : "Add Product";

  }

}


/* =========================
   EDIT PRODUCT
========================= */

async function editProduct(id){

  try{

    const result =
      await db
      .from("products")
      .select("*")
      .eq("id",id)
      .single();

    if(result.error){

      showFormMessage(
        result.error.message,
        true
      );

      return;
    }

    const p = result.data;

    editId = p.id;

    document.getElementById(
      "formTitle"
    ).textContent =
      "Edit Product";

    document.getElementById(
      "name"
    ).value =
      p.name || "";

    document.getElementById(
      "price"
    ).value =
      p.price || "";

    document.getElementById(
      "mrp"
    ).value =
      p.mrp || "";

    document.getElementById(
      "stock"
    ).value =
      p.stock || "";

    document.getElementById(
      "image"
    ).value =
      p.image_url || "";

    document.getElementById(
      "description"
    ).value =
      p.description || "";

    document.getElementById(
      "saveBtn"
    ).textContent =
      "Update Product";

    document.getElementById(
      "cancelBtn"
    ).style.display =
      "block";

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }catch(error){

    showFormMessage(
      error.message,
      true
    );

  }

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

  const ok =
    confirm(
      "Kya aap is product ko delete karna chahte hain?"
    );

  if(!ok) return;


  try{

    const result =
      await db
      .from("products")
      .delete()
      .eq("id",id);


    if(result.error){

      showFormMessage(
        result.error.message,
        true
      );

      return;
    }

    await loadProducts();

  }catch(error){

    showFormMessage(
      error.message,
      true
    );

  }

}


/* =========================
   ON / OFF
========================= */

async function toggleProduct(id,currentStatus){

  try{

    const result =
      await db
      .from("products")
      .update({
        is_active: !currentStatus
      })
      .eq("id",id);


    if(result.error){

      showFormMessage(
        result.error.message,
        true
      );

      return;
    }

    await loadProducts();

  }catch(error){

    showFormMessage(
      error.message,
      true
    );

  }

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

  editId = null;

  document.getElementById(
    "formTitle"
  ).textContent =
    "Add Product";

  document.getElementById(
    "name"
  ).value = "";

  document.getElementById(
    "price"
  ).value = "";

  document.getElementById(
    "mrp"
  ).value = "";

  document.getElementById(
    "stock"
  ).value = "";

  document.getElementById(
    "image"
  ).value = "";

  document.getElementById(
    "description"
  ).value = "";

  document.getElementById(
    "saveBtn"
  ).textContent =
    "Add Product";

  document.getElementById(
    "cancelBtn"
  ).style.display =
    "none";

  formMessage.textContent = "";

}


/* =========================
   CANCEL EDIT
========================= */

document.getElementById(
  "cancelBtn"
).addEventListener(
  "click",
  clearForm
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return String(value || "")
    .replace(/"/g,"&quot;")
    .replace(/</g,"%3C")
    .replace(/>/g,"%3E");

}


/* =========================
   BUTTON EVENTS
========================= */

loginBtn.addEventListener(
  "click",
  login
);

logoutBtn.addEventListener(
  "click",
  logout
);


/* ENTER KEY LOGIN */

document.getElementById(
  "password"
).addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      login();
    }

  }
);


/* =========================
   CHECK EXISTING SESSION
========================= */

async function checkSession(){

  try{

    const result =
      await db.auth.getSession();

    if(
      result.data &&
      result.data.session
    ){

      loginPage.style.display = "none";
      app.style.display = "block";

      await loadProducts();

    }

  }catch(error){

    console.error(
      "Session error:",
      error
    );

  }

}


/* START */

checkSession();

</script>

</body>
 </html>
