<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QELVIZO Owner Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f6f4;color:#17251c}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#123522}
.box{background:white;width:100%;max-width:380px;padding:30px;border-radius:18px}
.logo{text-align:center;font-size:30px;font-weight:bold;color:#174d30;margin-bottom:25px}
input,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:8px}
button{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:bold}
.login button,.save{width:100%;background:#174d30;color:white}
.error{color:#c00;margin-top:12px}
header{background:#123522;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
main{max-width:900px;margin:auto;padding:20px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:20px}
.product{border:1px solid #ddd;padding:12px;border-radius:10px;margin:10px 0;display:flex;gap:12px;align-items:center}
.product img{width:70px;height:70px;object-fit:cover;border-radius:8px}
.info{flex:1}
.actions button{margin:3px}
.edit{background:#e8f0ff;color:#1450a0}
.del{background:#ffe8e8;color:#b00020}
.hide{background:#eee}
#app{display:none}
</style>
</head>

<body>

<div id="login" class="login">
<div class="box">
<div class="logo">QELVIZO</div>

<input id="email" type="email" placeholder="Owner Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<div id="error" class="error"></div>
</div>
</div>


<div id="app">

<header>
<div><b>QELVIZO OWNER</b></div>
<button onclick="logout()">Logout</button>
</header>

<main>

<div class="card">
<h2 id="formTitle">Add Product</h2>

<input id="name" placeholder="Product Name">
<input id="price" type="number" placeholder="Price">
<input id="mrp" type="number" placeholder="MRP">
<input id="stock" type="number" placeholder="Stock">
<input id="image" placeholder="Image URL">

<textarea id="description" placeholder="Product Description"></textarea>

<button class="save" onclick="saveProduct()">Save Product</button>
</div>


<div class="card">
<h2>My Products</h2>
<div id="products">Loading...</div>
</div>

</main>
</div>


<script>
const URL="https://oogibbmsiiarceczqgfa.supabase.co";
const KEY="sb_publishable_VLedtJ2r9K4fC00T4k8CgA_ahfpM1dh";

const db=supabase.createClient(URL,KEY);

let editId=null;


async function login(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const error=document.getElementById("error");

error.textContent="";

const {data,error:err}=await db.auth.signInWithPassword({
email:email,
password:password
});

if(err){
error.textContent=err.message;
return;
}

showApp(data.user);
}


function showApp(user){

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

loadProducts();
}


async function logout(){

await db.auth.signOut();

document.getElementById("app").style.display="none";
document.getElementById("login").style.display="flex";
}


async function loadProducts(){

const box=document.getElementById("products");

const {data,error}=await db
.from("products")
.select("*")
.order("name");

if(error){
box.textContent=error.message;
return;
}

if(!data.length){
box.innerHTML="<p>No products yet.</p>";
return;
}

box.innerHTML="";

data.forEach(p=>{

const div=document.createElement("div");
div.className="product";

div.innerHTML=`
<img src="${p.image_url||'https://via.placeholder.com/70'}">
<div class="info">
<b>${safe(p.name)}</b>
<br>Price: ₹${p.price||0}
<br>MRP: ₹${p.mrp||0}
<br>Stock: ${p.stock||0}
<br>Status: ${p.is_active?"ON":"OFF"}
</div>
<div class="actions">
<button class="edit" onclick='editProduct(${JSON.stringify(p)})'>Edit</button>
<button class="hide" onclick="toggleProduct('${p.id}',${p.is_active})">${p.is_active?"OFF":"ON"}</button>
<button class="del" onclick="deleteProduct('${p.id}')">Delete</button>
</div>
`;

box.appendChild(div);
});
}


async function saveProduct(){

const product={
name:document.getElementById("name").value.trim(),
price:Number(document.getElementById("price").value||0),
mrp:Number(document.getElementById("mrp").value||0),
stock:Number(document.getElementById("stock").value||0),
image_url:document.getElementById("image").value.trim(),
description:document.getElementById("description").value.trim()
};

if(!product.name){
alert("Product name enter karein");
return;
}

let result;

if(editId){

result=await db
.from("products")
.update(product)
.eq("id",editId);

}else{

result=await db
.from("products")
.insert(product);
}

if(result.error){
alert(result.error.message);
return;
}

alert(editId?"Product updated":"Product added");

clearForm();
loadProducts();
}


function editProduct(p){

editId=p.id;

document.getElementById("formTitle").textContent="Edit Product";
document.getElementById("name").value=p.name||"";
document.getElementById("price").value=p.price||"";
document.getElementById("mrp").value=p.mrp||"";
document.getElementById("stock").value=p.stock||"";
document.getElementById("image").value=p.image_url||"";
document.getElementById("description").value=p.description||"";

window.scrollTo(0,0);
}


async function deleteProduct(id){

if(!confirm("Delete this product?"))return;

const {error}=await db
.from("products")
.delete()
.eq("id",id);

if(error){
alert(error.message);
return;
}

loadProducts();
}


async function toggleProduct(id,status){

const {error}=await db
.from("products")
.update({is_active:!status})
.eq("id",id);

if(error){
alert(error.message);
return;
}

loadProducts();
}


function clearForm(){

editId=null;

document.getElementById("formTitle").textContent="Add Product";
document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("mrp").value="";
document.getElementById("stock").value="";
document.getElementById("image").value="";
document.getElementById("description").value="";
}


function safe(x){

return String(x||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}


async function check(){

const {data}=await db.auth.getSession();

if(data.session){
showApp(data.session.user);
}
}

check();
</script>
alert("TEST");
document.getElementById("error").textContent="JavaScript is working";
const URL="https://oogibbmsiiarceczqgfa.supabase.co";
const KEY="sb_publishable_VLedtJ2r9K4fC00T4k8CgA_ahfpM1dh";

const db=supabase.createClient(URL,KEY);
</body>
</html>
