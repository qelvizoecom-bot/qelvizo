<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QELVIZO Owner Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    h2 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      margin-bottom: 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      font-weight: 600;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .ok {
      background: #dcfce7;
      color: #166534;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .stat {
      background: #f9fafb;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 5px;
    }

    .products {
      display: grid;
      gap: 15px;
    }

    .product {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .product img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      background: #f3f4f6;
    }

    .product-info {
      flex: 1;
    }

    .product-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .price {
      font-weight: 700;
    }

    .mrp {
      color: #6b7280;
      text-decoration: line-through;
      margin-left: 8px;
    }

    .stock {
      margin-top: 5px;
      color: #374151;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .product {
        align-items: flex-start;
        flex-direction: column;
      }

      .product img {
        width: 100%;
        height: 180px;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <div class="brand">QELVIZO</div>
    <div class="subtitle">Owner Login</div>

    <label>Email</label>
    <input id="email" type="email" placeholder="Owner email">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn" class="primary">Login</button>

    <div id="loginMessage" class="message"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="brand">QELVIZO OWNER PANEL</div>
    <div class="subtitle">
      Manage your products
    </div>

    <!-- STATS -->
    <div class="stats">

      <div class="stat">
        Products
        <strong id="totalProducts">0</strong>
      </div>

      <div class="stat">
        Stock
        <strong id="totalStock">0</strong>
      </div>

      <div class="stat">
        Active
        <strong id="activeProducts">0</strong>
      </div>

    </div>

    <br>


    <!-- ADD PRODUCT -->
    <div class="card">

      <h2 id="formTitle">Add Product</h2>

      <label>Product Name</label>
      <input
        id="productName"
        type="text"
        placeholder="Example: Garden Rake"
      >

      <label>Selling Price</label>
      <input
        id="productPrice"
        type="number"
        placeholder="199"
      >

      <label>MRP</label>
      <input
        id="productMrp"
        type="number"
        placeholder="299"
      >

      <label>Stock Quantity</label>
      <input
        id="productStock"
        type="number"
        placeholder="10"
      >

      <label>Product Image URL</label>
      <input
        id="productImage"
        type="url"
        placeholder="https://example.com/image.jpg"
      >

      <label>Description</label>
      <textarea
        id="productDescription"
        placeholder="Write product description..."
      ></textarea>

      <button id="saveBtn" class="primary">
        Save Product
      </button>

      <button
        id="cancelBtn"
        class="secondary hidden"
        type="button"
      >
        Cancel Edit
      </button>

      <div id="productMessage" class="message"></div>

    </div>


    <!-- PRODUCTS -->
    <div class="card">

      <h2>My Products</h2>

      <div id="productsList" class="products">
        Loading products...
      </div>

    </div>


    <button id="logoutBtn" class="danger">
      Logout
    </button>

  </div>

</div>


<script>

  /* ==============================
     SUPABASE CONFIG
  ============================== */

  const SUPABASE_URL =
    "https://oogibbmsiiarceczqgfa.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_VLedtJ2r9K4fC00T4k8CgA_ahfpM1dh";

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* ==============================
     ELEMENTS
  ============================== */

  const loginBox = document.getElementById("loginBox");
  const dashboard = document.getElementById("dashboard");

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const loginMessage = document.getElementById("loginMessage");
  const productMessage = document.getElementById("productMessage");

  const productName = document.getElementById("productName");
  const productPrice = document.getElementById("productPrice");
  const productMrp = document.getElementById("productMrp");
  const productStock = document.getElementById("productStock");
  const productImage = document.getElementById("productImage");
  const productDescription = document.getElementById("productDescription");

  const saveBtn = document.getElementById("saveBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  const productsList = document.getElementById("productsList");

  let editingId = null;


  /* ==============================
     MESSAGE
  ============================== */

  function showMessage(element, message, type) {

    element.textContent = message;

    element.className = "message " + type;

    element.style.display = "block";

  }


  function hideMessage(element) {

    element.style.display = "none";

  }


  /* ==============================
     ESCAPE HTML
  ============================== */

  function escapeHTML(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ==============================
     LOGIN
  ============================== */

  loginBtn.addEventListener("click", async function() {

    hideMessage(loginMessage);

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      showMessage(
        loginMessage,
        "Email aur password enter karein.",
        "error"
      );

      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";


    const { data, error } =
      await db.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      showMessage(
        loginMessage,
        error.message,
        "error"
      );

      loginBtn.disabled = false;
      loginBtn.textContent = "Login";

      return;
    }


    if (!data.session) {

      showMessage(
        loginMessage,
        "Login session nahi mili.",
        "error"
      );

      loginBtn.disabled = false;
      loginBtn.textContent = "Login";

      return;
    }


    loginBox.classList.add("hidden");
    dashboard.classList.remove("hidden");

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";

    await loadProducts();

  });


  /* ==============================
     CHECK EXISTING SESSION
  ============================== */

  async function checkSession() {

    const {
      data: { session }
    } = await db.auth.getSession();


    if (session) {

      loginBox.classList.add("hidden");
      dashboard.classList.remove("hidden");

      await loadProducts();

    }

  }


  /* ==============================
     LOAD PRODUCTS
  ============================== */

  async function loadProducts() {

    productsList.innerHTML =
      "Loading products...";


    const {
      data,
      error
    } = await db
      .from("products")
      .select("*")
      .order("name");


    if (error) {

      productsList.innerHTML =
        "<p>Products load nahi ho rahe: "
        + escapeHTML(error.message)
        + "</p>";

      return;
    }


    updateStats(data || []);

    renderProducts(data || []);

  }


  /* ==============================
     STATS
  ============================== */

  function updateStats(products) {

    document.getElementById(
      "totalProducts"
    ).textContent = products.length;


    const totalStock =
      products.reduce(
        (sum, product) =>
          sum + Number(product.stock || 0),
        0
      );


    document.getElementById(
      "totalStock"
    ).textContent = totalStock;


    const active =
      products.filter(
        product => product.is_active === true
      ).length;


    document.getElementById(
      "activeProducts"
    ).textContent = active;

  }


  /* ==============================
     RENDER PRODUCTS
  ============================== */

  function renderProducts(products) {

    if (!products.length) {

      productsList.innerHTML =
        "<p>No products found.</p>";

      return;
    }


    productsList.innerHTML =
      products.map(product => {

        const image =
          product.image_url ||
          "https://via.placeholder.com/300x200?text=QELVIZO";


        return `

          <div class="product">

            <img
              src="${escapeHTML(image)}"
              alt="${escapeHTML(product.name)}"
              onerror="this.src='https://via.placeholder.com/300x200?text=QELVIZO'"
            >

            <div class="product-info">

              <div class="product-name">
                ${escapeHTML(product.name)}
              </div>

              <div>
                <span class="price">
                  ₹${escapeHTML(product.price)}
                </span>

                <span class="mrp">
                  ₹${escapeHTML(product.mrp)}
                </span>
              </div>

              <div class="stock">
                Stock: ${escapeHTML(product.stock)}
              </div>

              <div class="stock">
                Status:
                ${
                  product.is_active
                  ? "Active"
                  : "Inactive"
                }
              </div>

              <p>
                ${escapeHTML(product.description || "")}
              </p>

              <div class="actions">

                <button
                  class="secondary"
                  onclick="editProduct('${product.id}')"
                >
                  Edit
                </button>

                <button
                  class="success"
                  onclick="toggleProduct('${product.id}', ${product.is_active})"
                >
                  ${
                    product.is_active
                    ? "Disable"
                    : "Enable"
                  }
                </button>

                <button
                  class="danger"
                  onclick="deleteProduct('${product.id}')"
                >
                  Delete
                </button>

              </div>

            </div>

          </div>

        `;

      }).join("");

  }


  /* ==============================
     SAVE PRODUCT
  ============================== */

  saveBtn.addEventListener("click", async function() {

    hideMessage(productMessage);


    const name =
      productName.value.trim();

    const description =
      productDescription.value.trim();

    const price =
      Number(productPrice.value);

    const mrp =
      Number(productMrp.value);

    const stock =
      Number(productStock.value);

    const image_url =
      productImage.value.trim();


    if (!name) {

      showMessage(
        productMessage,
        "Product name required hai.",
        "error"
      );

      return;
    }


    if (!price || price < 0) {

      showMessage(
        productMessage,
        "Valid selling price enter karein.",
        "error"
      );

      return;
    }


    if (!mrp || mrp < 0) {

      showMessage(
        productMessage,
        "Valid MRP enter karein.",
        "error"
      );

      return;
    }


    if (stock < 0 || isNaN(stock)) {

      showMessage(
        productMessage,
        "Valid stock quantity enter karein.",
        "error"
      );

      return;
    }


    saveBtn.disabled = true;
    saveBtn.textContent =
      editingId
      ? "Updating..."
      : "Saving...";


    const productData = {

      name: name,

      description:
        description || null,

      price: price,

      mrp: mrp,

      image_url:
        image_url || null,

      stock: stock,

      is_active: true

    };


    let result;


    if (editingId) {

      result =
        await db
          .from("products")
          .update(productData)
          .eq("id", editingId);

    } else {

      result =
        await db
          .from("products")
          .insert([productData]);

    }


    if (result.error) {

      showMessage(
        productMessage,
        "Product save nahi hua: "
        + result.error.message,
        "error"
      );

      saveBtn.disabled = false;
      saveBtn.textContent =
        editingId
        ? "Update Product"
        : "Save Product";

      return;
    }


    showMessage(
      productMessage,
      editingId
      ? "Product successfully updated!"
      : "Product successfully added!",
      "ok"
    );


    clearForm();

    await loadProducts();


    saveBtn.disabled = false;
    saveBtn.textContent = "Save Product";

  });


  /* ==============================
     EDIT PRODUCT
  ============================== */

  window.editProduct = async function(id) {

    const {
      data,
      error
    } = await db
      .from("products")
      .select("*")
      .eq("id", id)
      .single();


    if (error) {

      alert(error.message);

      return;
    }


    editingId = id;


    productName.value =
      data.name || "";

    productPrice.value =
      data.price ?? "";

    productMrp.value =
      data.mrp ?? "";

    productStock.value =
      data.stock ?? "";

    productImage.value =
      data.image_url || "";

    productDescription.value =
      data.description || "";


    document.getElementById(
      "formTitle"
    ).textContent = "Edit Product";


    saveBtn.textContent =
      "Update Product";


    cancelBtn.classList.remove(
      "hidden"
    );


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  };


  /* ==============================
     CANCEL EDIT
  ============================== */

  cancelBtn.addEventListener(
    "click",
    function() {

      clearForm();

    }
  );


  function clearForm() {

    editingId = null;

    productName.value = "";
    productPrice.value = "";
    productMrp.value = "";
    productStock.value = "";
    productImage.value = "";
    productDescription.value = "";

    document.getElementById(
      "formTitle"
    ).textContent = "Add Product";

    saveBtn.textContent =
      "Save Product";

    cancelBtn.classList.add(
      "hidden"
    );

  }


  /* ==============================
     TOGGLE ACTIVE
  ============================== */

  window.toggleProduct = async function(
    id,
    currentStatus
  ) {

    const {
      error
    } = await db
      .from("products")
      .update({
        is_active: !currentStatus
      })
      .eq("id", id);


    if (error) {

      alert(
        "Status update nahi hua: "
        + error.message
      );

      return;
    }


    await loadProducts();

  };


  /* ==============================
     DELETE PRODUCT
  ============================== */

  window.deleteProduct = async function(id) {

    const confirmed =
      confirm(
        "Kya aap ye product delete karna chahte hain?"
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } = await db
      .from("products")
      .delete()
      .eq("id", id);


    if (error) {

      alert(
        "Product delete nahi hua: "
        + error.message
      );

      return;
    }


    await loadProducts();

  };


  /* ==============================
     LOGOUT
  ============================== */

  logoutBtn.addEventListener(
    "click",
    async function() {

      await db.auth.signOut();

      dashboard.classList.add(
        "hidden"
      );

      loginBox.classList.remove(
        "hidden"
      );

      clearForm();

    }
  );


  /* ==============================
     START
  ============================== */

  checkSession();

</script>

</body>
</html>
