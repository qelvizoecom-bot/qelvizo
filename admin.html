<!DOCTYPE html>
<html lang="en">
  <link rel="manifest" href="/manifest.json">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QELVIZO Owner Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f6f8;
color:#222;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.brand{
font-size:26px;
font-weight:800;
text-align:center;
margin-top:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

.card{
background:white;
border-radius:14px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.hidden{
display:none!important;
}

label{
display:block;
font-weight:600;
margin-top:14px;
margin-bottom:6px;
}

input,textarea,select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
background:white;
}

textarea{
min-height:90px;
resize:vertical;
}

button{
border:0;
border-radius:8px;
padding:11px 16px;
font-size:14px;
font-weight:700;
cursor:pointer;
margin-top:10px;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.primary{
background:#111;
color:white;
width:100%;
}

.secondary{
background:#eee;
color:#222;
}

.success{
background:#198754;
color:white;
}

.danger{
background:#dc3545;
color:white;
}

.refresh{
background:#111;
color:white;
width:100%;
}

.message{
display:none;
padding:12px;
border-radius:8px;
margin-top:12px;
font-size:14px;
}

.message.ok{
display:block;
background:#e8f7ee;
color:#14733c;
}

.message.error{
display:block;
background:#fdecec;
color:#a61b1b;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.stat{
background:white;
padding:18px;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,.06);
text-align:center;
font-size:14px;
}

.stat strong{
display:block;
font-size:25px;
margin-top:7px;
}

.preview{
display:none;
width:150px;
height:150px;
object-fit:cover;
border-radius:10px;
margin-top:10px;
border:1px solid #ddd;
}

.product{
display:flex;
gap:15px;
padding:15px 0;
border-bottom:1px solid #eee;
}

.product:last-child{
border-bottom:0;
}

.product>img{
width:120px;
height:120px;
object-fit:cover;
border-radius:10px;
background:#eee;
}

.product-info{
flex:1;
}

.product-name{
font-size:18px;
font-weight:700;
margin-bottom:7px;
}

.price{
font-weight:700;
font-size:17px;
}

.mrp{
text-decoration:line-through;
color:#888;
margin-left:8px;
}

.stock{
color:#555;
margin-top:5px;
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.actions button{
margin-top:8px;
}

.order{
border:1px solid #e4e4e4;
border-radius:12px;
padding:16px;
margin-bottom:15px;
background:#fff;
}

.order-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.order-id{
font-size:12px;
color:#777;
word-break:break-all;
}

.customer{
margin-top:12px;
line-height:1.6;
}

.items{
background:#f7f7f7;
padding:10px;
border-radius:8px;
margin-top:10px;
}

.item-row{
padding:6px 0;
border-bottom:1px solid #ddd;
}

.item-row:last-child{
border-bottom:0;
}

.order-total{
font-size:18px;
font-weight:800;
margin-top:12px;
}

.status-box{
margin-top:12px;
}

.status-box select{
font-weight:700;
}

.empty{
text-align:center;
padding:20px;
color:#777;
}

.login-card{
max-width:450px;
margin:70px auto 20px;
}

.section-title{
font-size:21px;
font-weight:800;
margin-bottom:15px;
}

@media(max-width:600px){

.container{
padding:12px;
}

.stats{
grid-template-columns:1fr 1fr 1fr;
}

.stat{
padding:12px 5px;
font-size:12px;
}

.stat strong{
font-size:20px;
}

.product{
align-items:flex-start;
}

.product>img{
width:90px;
height:90px;
}

.product-name{
font-size:16px;
}

.actions button{
font-size:12px;
padding:9px 11px;
}

}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginBox" class="card login-card">

<div class="brand">
QELVIZO
</div>

<div class="subtitle">
Owner Login
</div>

<label>Email</label>

<input
id="email"
type="email"
placeholder="Owner email"
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Password"
>

<button id="loginBtn" class="primary">
Login
</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="hidden">

<div class="brand">
QELVIZO OWNER PANEL
</div>

<div class="subtitle">
Manage your products and orders
</div>


<!-- STATS -->

<div class="stats">

<div class="stat">
Products
<strong id="totalProducts">0</strong>
</div>

<div class="stat">
Stock
<strong id="totalStock">0</strong>
</div>

<div class="stat">
Active
<strong id="activeProducts">0</strong>
</div>

</div>

<br>


<!-- PRODUCT FORM -->

<div class="card">

<h2 id="formTitle">
Add Product
</h2>

<label>
Product Name
</label>

<input
id="productName"
type="text"
placeholder="Garden Rake"
>

<label>
Selling Price
</label>

<input
id="productPrice"
type="number"
placeholder="199"
>

<label>
MRP
</label>

<input
id="productMrp"
type="number"
placeholder="299"
>

<label>
Stock Quantity
</label>

<input
id="productStock"
type="number"
placeholder="10"
>

<label>
Product Image
</label>

<input
id="productFile"
type="file"
accept="image/*"
>

<img
id="imagePreview"
class="preview"
>

<label>
Description
</label>

<textarea
id="productDescription"
placeholder="Write product description..."
></textarea>

<button
id="saveBtn"
class="primary"
>
Save Product
</button>

<button
id="cancelBtn"
class="secondary hidden"
>
Cancel Edit
</button>

<div
id="productMessage"
class="message"
></div>

</div>


<!-- PRODUCTS -->

<div class="card">

<div class="section-title">
My Products
</div>

<div id="productsList">
Loading products...
</div>

</div>


<!-- ORDERS -->

<div class="card">

<div class="section-title">
Customer Orders
</div>

<button
id="refreshOrdersBtn"
class="refresh"
>
Refresh Orders
</button>

<br><br>

<div id="ordersList">
Loading orders...
</div>

</div>


<button
id="logoutBtn"
class="danger"
style="width:100%;"
>
Logout
</button>

</div>

</div>


<script>


/* SUPABASE */

const SUPABASE_URL =
"https://oogibbmsiiarceczqgfa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VLedtJ2r9K4fC00T4k8CgA_ahfpM1dh";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ELEMENTS */

const loginBox =
document.getElementById("loginBox");

const dashboard =
document.getElementById("dashboard");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const loginMessage =
document.getElementById("loginMessage");

const productMessage =
document.getElementById("productMessage");

const productName =
document.getElementById("productName");

const productPrice =
document.getElementById("productPrice");

const productMrp =
document.getElementById("productMrp");

const productStock =
document.getElementById("productStock");

const productFile =
document.getElementById("productFile");

const productDescription =
document.getElementById("productDescription");

const imagePreview =
document.getElementById("imagePreview");

const saveBtn =
document.getElementById("saveBtn");

const cancelBtn =
document.getElementById("cancelBtn");

const productsList =
document.getElementById("productsList");

const ordersList =
document.getElementById("ordersList");

const refreshOrdersBtn =
document.getElementById("refreshOrdersBtn");


let editingId = null;

let oldImageUrl = null;

let selectedFile = null;


/* MESSAGE */

function message(el,text,type){

el.textContent = text;

el.className =
"message " + type;

el.style.display =
"block";

}


function hideMessage(el){

el.style.display =
"none";

}


/* ESCAPE */

function esc(v){

if(v===null || v===undefined){

return "";

}

return String(v)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* IMAGE SELECT */

productFile.addEventListener(
"change",
function(){

selectedFile =
this.files[0] || null;

if(!selectedFile){

imagePreview.style.display =
"none";

return;

}

if(!selectedFile.type.startsWith("image/")){

message(
productMessage,
"Sirf image file select karein.",
"error"
);

this.value="";

selectedFile=null;

return;

}

if(selectedFile.size >
5*1024*1024){

message(
productMessage,
"Image 5MB se chhoti honi chahiye.",
"error"
);

this.value="";

selectedFile=null;

return;

}

const reader =
new FileReader();

reader.onload =
function(e){

imagePreview.src =
e.target.result;

imagePreview.style.display =
"block";

};

reader.readAsDataURL(
selectedFile
);

});


/* LOGIN */

loginBtn.addEventListener(
"click",
async()=>{

hideMessage(loginMessage);

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

if(!email || !password){

message(
loginMessage,
"Email aur password enter karein.",
"error"
);

return;

}

loginBtn.disabled=true;

loginBtn.textContent=
"Logging in...";


const {data,error} =
await db.auth
.signInWithPassword({

email:email,

password:password

});


if(error){

message(
loginMessage,
error.message,
"error"
);

loginBtn.disabled=false;

loginBtn.textContent=
"Login";

return;

}


if(!data.session){

message(
loginMessage,
"Login session nahi mili.",
"error"
);

loginBtn.disabled=false;

loginBtn.textContent=
"Login";

return;

}


loginBox.classList.add(
"hidden"
);

dashboard.classList.remove(
"hidden"
);

loginBtn.disabled=false;

loginBtn.textContent=
"Login";


loadProducts();

loadOrders();

});


/* SESSION */

async function checkSession(){

const {
data:{session}
} =
await db.auth.getSession();


if(session){

loginBox.classList.add(
"hidden"
);

dashboard.classList.remove(
"hidden"
);

loadProducts();

loadOrders();

}

}


/* LOAD PRODUCTS */

async function loadProducts(){

productsList.innerHTML =
"Loading products...";


const {data,error} =
await db
.from("products")
.select("*")
.order("name");


if(error){

productsList.innerHTML =
"Products load nahi ho rahe: "
+
esc(error.message);

return;

}


updateStats(
data || []
);

renderProducts(
data || []
);

}


/* STATS */

function updateStats(products){

document
.getElementById("totalProducts")
.textContent =
products.length;


let stock =
products.reduce(
(sum,p)=>
sum + Number(p.stock || 0),
0
);


document
.getElementById("totalStock")
.textContent =
stock;


let active =
products.filter(
p=>p.is_active===true
).length;


document
.getElementById("activeProducts")
.textContent =
active;

}


/* RENDER PRODUCTS */

function renderProducts(products){

if(!products.length){

productsList.innerHTML =
'<div class="empty">No products found.</div>';

return;

}


productsList.innerHTML =
products.map(p=>{

const image =
p.image_url ||
"https://via.placeholder.com/300x200?text=QELVIZO";


return `

<div class="product">

<img
src="${esc(image)}"
onerror="this.src='https://via.placeholder.com/300x200?text=QELVIZO'"
>

<div class="product-info">

<div class="product-name">
${esc(p.name)}
</div>

<div>

<span class="price">
₹${esc(p.price)}
</span>

<span class="mrp">
₹${esc(p.mrp)}
</span>

</div>

<div class="stock">
Stock: ${esc(p.stock)}
</div>

<div class="stock">
Status:
${p.is_active ? "Active" : "Inactive"}
</div>

<p>
${esc(p.description || "")}
</p>

<div class="actions">

<button
class="secondary"
onclick="editProduct('${esc(p.id)}')"
>
Edit
</button>

<button
class="success"
onclick="toggleProduct('${esc(p.id)}',${p.is_active})"
>
${p.is_active ? "Disable" : "Enable"}
</button>

<button
class="danger"
onclick="deleteProduct('${esc(p.id)}')"
>
Delete
</button>

</div>

</div>

</div>

`;

}).join("");

}


/* UPLOAD IMAGE */

async function uploadImage(
file,
userId
){

const extension =
file.name
.split(".")
.pop()
.toLowerCase();


const fileName =
Date.now()
+
"-"
+
Math.random()
.toString(36)
.substring(2,9)
+
"."
+
extension;


const filePath =
userId
+
"/"
+
fileName;


const {error} =
await db.storage
.from("product-images")
.upload(
filePath,
file,
{
cacheControl:"3600",
upsert:false
}
);


if(error){

throw error;

}


const {data} =
db.storage
.from("product-images")
.getPublicUrl(
filePath
);


return data.publicUrl;

}


/* SAVE PRODUCT */

saveBtn.addEventListener(
"click",
async()=>{

hideMessage(productMessage);


const name =
productName.value.trim();

const description =
productDescription.value.trim();

const price =
Number(productPrice.value);

const mrp =
Number(productMrp.value);

const stock =
Number(productStock.value);


if(!name){

message(
productMessage,
"Product name required hai.",
"error"
);

return;

}


if(isNaN(price) || price<0){

message(
productMessage,
"Valid selling price enter karein.",
"error"
);

return;

}


if(isNaN(mrp) || mrp<0){

message(
productMessage,
"Valid MRP enter karein.",
"error"
);

return;

}


if(isNaN(stock) || stock<0){

message(
productMessage,
"Valid stock quantity enter karein.",
"error"
);

return;

}


saveBtn.disabled=true;

saveBtn.textContent =
editingId
?
"Updating..."
:
"Saving...";


try{


const {
data:{user}
} =
await db.auth.getUser();


if(!user){

throw new Error(
"Owner login session expired. Dobara login karein."
);

}


let imageUrl =
oldImageUrl;


if(selectedFile){

message(
productMessage,
"Image upload ho rahi hai...",
"ok"
);


imageUrl =
await uploadImage(
selectedFile,
user.id
);

}


const productData={

name:name,

description:
description || null,

price:price,

mrp:mrp,

image_url:
imageUrl || null,

stock:stock,

is_active:true

};


let result;


if(editingId){

result =
await db
.from("products")
.update(productData)
.eq("id",editingId);

}else{

result =
await db
.from("products")
.insert([
productData
]);

}


if(result.error){

throw result.error;

}


message(
productMessage,
editingId
?
"Product successfully updated!"
:
"Product successfully added!",
"ok"
);


clearForm();

await loadProducts();


}catch(error){

message(
productMessage,
"Save nahi hua: "
+
error.message,
"error"
);

}


saveBtn.disabled=false;

saveBtn.textContent =
"Save Product";

});


/* EDIT */

window.editProduct =
async function(id){

const {data,error} =
await db
.from("products")
.select("*")
.eq("id",id)
.single();


if(error){

alert(error.message);

return;

}


editingId=id;

oldImageUrl =
data.image_url || null;


productName.value =
data.name || "";

productPrice.value =
data.price ?? "";

productMrp.value =
data.mrp ?? "";

productStock.value =
data.stock ?? "";

productDescription.value =
data.description || "";


selectedFile=null;

productFile.value="";


if(data.image_url){

imagePreview.src =
data.image_url;

imagePreview.style.display =
"block";

}else{

imagePreview.style.display =
"none";

}


document
.getElementById("formTitle")
.textContent =
"Edit Product";


saveBtn.textContent =
"Update Product";


cancelBtn.classList.remove(
"hidden"
);


window.scrollTo({

top:0,

behavior:"smooth"

});

};


/* CANCEL */

cancelBtn.addEventListener(
"click",
clearForm
);


function clearForm(){

editingId=null;

oldImageUrl=null;

selectedFile=null;


productName.value="";

productPrice.value="";

productMrp.value="";

productStock.value="";

productDescription.value="";

productFile.value="";


imagePreview.src="";

imagePreview.style.display =
"none";


document
.getElementById("formTitle")
.textContent =
"Add Product";


saveBtn.textContent =
"Save Product";


cancelBtn.classList.add(
"hidden"
);

}


/* TOGGLE PRODUCT */

window.toggleProduct =
async function(id,status){

const {error} =
await db
.from("products")
.update({
is_active:!status
})
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadProducts();

};


/* DELETE PRODUCT */

window.deleteProduct =
async function(id){

if(!confirm(
"Kya aap ye product delete karna chahte hain?"
)){

return;

}


const {error} =
await db
.from("products")
.delete()
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadProducts();

};


/* ========================= */
/* ORDERS */
/* ========================= */


/* LOAD ORDERS */

async function loadOrders(){

ordersList.innerHTML =
"Loading orders...";


const {data,error} =
await db
.from("orders")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

ordersList.innerHTML =
"Orders load nahi ho rahe: "
+
esc(error.message);

return;

}


renderOrders(
data || []
);

}


/* RENDER ORDERS */

function renderOrders(orders){

if(!orders.length){

ordersList.innerHTML =
'<div class="empty">Abhi koi order nahi hai.</div>';

return;

}


ordersList.innerHTML =
orders.map(order=>{


let items=[];


try{

items =
typeof order.items === "string"
?
JSON.parse(order.items)
:
(order.items || []);

}catch(e){

items=[];

}


const allowedStatuses=[
"Pending",
"Confirmed",
"Shipped",
"Delivered",
"Cancelled"
];


const currentStatus =
allowedStatuses.includes(
order.status
)
?
order.status
:
"Pending";


const itemsHtml =
items.length
?
items.map(item=>{

const itemName =
item.name ||
item.product_name ||
"Product";

const quantity =
Number(
item.quantity ||
item.qty ||
1
);

const itemPrice =
Number(
item.price ||
0
);


return `

<div class="item-row">

${esc(itemName)}

× ${quantity}

&nbsp; — &nbsp;

₹${itemPrice.toFixed(2)}

</div>

`;

}).join("")
:
"<div>No product details</div>";


const total =
Number(order.total || 0);


const date =
order.created_at
?
new Date(
order.created_at
).toLocaleString(
"en-IN"
)
:
"";


return `

<div class="order">

<div class="order-header">

<div>

<strong>
Order
</strong>

<div class="order-id">
${esc(order.id)}
</div>

</div>

<strong>
${esc(currentStatus)}
</strong>

</div>


<div class="customer">

<strong>
Customer:
</strong>

${esc(order.customer_name)}

<br>

<strong>
Phone:
</strong>

${esc(order.customer_phone)}

<br>

<strong>
Address:
</strong>

${esc(order.customer_address)}

<br>

<strong>
Payment:
</strong>

${esc(order.payment_method || "COD")}

<br>

<strong>
Date:
</strong>

${esc(date)}

</div>


<div class="items">

<strong>
Products
</strong>

${itemsHtml}

</div>


<div class="order-total">

Total:
₹${total.toFixed(2)}

</div>


<div class="status-box">

<label>
Order Status
</label>

<select
onchange="updateOrderStatus('${esc(order.id)}',this.value)"
>

${allowedStatuses.map(status=>`

<option
value="${status}"
${status===currentStatus ? "selected" : ""}
>
${status}
</option>

`).join("")}

</select>

</div>

</div>

`;

}).join("");

}


/* UPDATE ORDER STATUS */

window.updateOrderStatus =
async function(id,newStatus){

const allowedStatuses=[
"Pending",
"Confirmed",
"Shipped",
"Delivered",
"Cancelled"
];


if(!allowedStatuses.includes(
newStatus
)){

alert("Invalid order status.");

return;

}


const {error} =
await db
.from("orders")
.update({
status:newStatus
})
.eq("id",id);


if(error){

alert(
"Status update nahi hua: "
+
error.message
);

return;

}


await loadOrders();

};


/* REFRESH ORDERS */

refreshOrdersBtn.addEventListener(
"click",
async()=>{

refreshOrdersBtn.disabled=true;

refreshOrdersBtn.textContent =
"Refreshing...";

await loadOrders();

refreshOrdersBtn.disabled=false;

refreshOrdersBtn.textContent =
"Refresh Orders";

});


/* LOGOUT */

logoutBtn.addEventListener(
