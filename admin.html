<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QELVIZO Owner Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#111827}
.container{max-width:1100px;margin:auto;padding:20px}
.brand{font-size:28px;font-weight:800}
.subtitle{color:#6b7280;margin:5px 0 25px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
input,textarea{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #d1d5db;border-radius:9px;font-size:15px}
textarea{min-height:100px}
label{font-weight:600;font-size:14px}
button{border:0;border-radius:9px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:white}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#dc2626;color:white}
.success{background:#16a34a;color:white}
.message{margin-top:12px;padding:10px;border-radius:8px;display:none}
.error{background:#fee2e2;color:#991b1b}
.ok{background:#dcfce7;color:#166534}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.stat{background:#f9fafb;padding:18px;border-radius:12px;text-align:center}
.stat strong{display:block;font-size:28px;margin-top:5px}
.products{display:grid;gap:15px}
.product{border:1px solid #e5e7eb;border-radius:12px;padding:15px;display:flex;gap:15px;align-items:center}
.product img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#f3f4f6}
.product-info{flex:1}
.product-name{font-size:18px;font-weight:700;margin-bottom:5px}
.price{font-weight:700}
.mrp{color:#6b7280;text-decoration:line-through;margin-left:8px}
.stock{margin-top:5px;color:#374151}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.preview{max-width:180px;max-height:180px;border-radius:10px;margin:5px 0 15px;display:none}
@media(max-width:700px){
.stats{grid-template-columns:1fr}
.product{flex-direction:column;align-items:flex-start}
.product img{width:100%;height:180px}
}
</style>
</head>

<body>
<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
<div class="brand">QELVIZO</div>
<div class="subtitle">Owner Login</div>

<label>Email</label>
<input id="email" type="email" placeholder="Owner email">

<label>Password</label>
<input id="password" type="password" placeholder="Password">

<button id="loginBtn" class="primary">Login</button>
<div id="loginMessage" class="message"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="brand">QELVIZO OWNER PANEL</div>
<div class="subtitle">Manage your products</div>

<div class="stats">
<div class="stat">Products<strong id="totalProducts">0</strong></div>
<div class="stat">Stock<strong id="totalStock">0</strong></div>
<div class="stat">Active<strong id="activeProducts">0</strong></div>
</div>

<br>

<!-- PRODUCT FORM -->
<div class="card">
<h2 id="formTitle">Add Product</h2>

<label>Product Name</label>
<input id="productName" type="text" placeholder="Garden Rake">

<label>Selling Price</label>
<input id="productPrice" type="number" placeholder="199">

<label>MRP</label>
<input id="productMrp" type="number" placeholder="299">

<label>Stock Quantity</label>
<input id="productStock" type="number" placeholder="10">

<label>Product Image</label>
<input id="productFile" type="file" accept="image/*">

<img id="imagePreview" class="preview">

<label>Description</label>
<textarea id="productDescription" placeholder="Write product description..."></textarea>

<button id="saveBtn" class="primary">Save Product</button>
<button id="cancelBtn" class="secondary hidden">Cancel Edit</button>

<div id="productMessage" class="message"></div>
</div>

<!-- PRODUCTS -->
<div class="card">
<h2>My Products</h2>
<div id="productsList">Loading products...</div>
</div>

<button id="logoutBtn" class="danger">Logout</button>

</div>
</div>

<script>

const SUPABASE_URL =
"https://oogibbmsiiarceczqgfa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VLedtJ2r9K4fC00T4k8CgA_ahfpM1dh";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const loginBox=document.getElementById("loginBox");
const dashboard=document.getElementById("dashboard");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const loginMessage=document.getElementById("loginMessage");
const productMessage=document.getElementById("productMessage");

const productName=document.getElementById("productName");
const productPrice=document.getElementById("productPrice");
const productMrp=document.getElementById("productMrp");
const productStock=document.getElementById("productStock");
const productFile=document.getElementById("productFile");
const productDescription=document.getElementById("productDescription");
const imagePreview=document.getElementById("imagePreview");

const saveBtn=document.getElementById("saveBtn");
const cancelBtn=document.getElementById("cancelBtn");
const productsList=document.getElementById("productsList");

let editingId=null;
let oldImageUrl=null;
let selectedFile=null;


/* MESSAGE */

function message(el,text,type){
el.textContent=text;
el.className="message "+type;
el.style.display="block";
}

function hideMessage(el){
el.style.display="none";
}


/* ESCAPE */

function esc(v){
if(v===null||v===undefined)return "";
return String(v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


/* IMAGE SELECT */

productFile.addEventListener("change",function(){

selectedFile=this.files[0]||null;

if(!selectedFile){
imagePreview.style.display="none";
return;
}

if(!selectedFile.type.startsWith("image/")){
message(
productMessage,
"Sirf image file select karein.",
"error"
);
this.value="";
selectedFile=null;
return;
}

if(selectedFile.size>5*1024*1024){
message(
productMessage,
"Image 5MB se chhoti honi chahiye.",
"error"
);
this.value="";
selectedFile=null;
return;
}

const reader=new FileReader();

reader.onload=function(e){
imagePreview.src=e.target.result;
imagePreview.style.display="block";
};

reader.readAsDataURL(selectedFile);

});


/* LOGIN */

loginBtn.addEventListener("click",async()=>{

hideMessage(loginMessage);

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email||!password){
message(
loginMessage,
"Email aur password enter karein.",
"error"
);
return;
}

loginBtn.disabled=true;
loginBtn.textContent="Logging in...";

const {data,error}=await db.auth.signInWithPassword({
email,
password
});

if(error){
message(loginMessage,error.message,"error");
loginBtn.disabled=false;
loginBtn.textContent="Login";
return;
}

if(!data.session){
message(
loginMessage,
"Login session nahi mili.",
"error"
);
loginBtn.disabled=false;
loginBtn.textContent="Login";
return;
}

loginBox.classList.add("hidden");
dashboard.classList.remove("hidden");

loginBtn.disabled=false;
loginBtn.textContent="Login";

loadProducts();

});


/* SESSION */

async function checkSession(){

const {data:{session}}=await db.auth.getSession();

if(session){
loginBox.classList.add("hidden");
dashboard.classList.remove("hidden");
loadProducts();
}

}


/* LOAD PRODUCTS */

async function loadProducts(){

productsList.innerHTML="Loading products...";

const {data,error}=await db
.from("products")
.select("*")
.order("name");

if(error){
productsList.innerHTML=
"Products load nahi ho rahe: "+esc(error.message);
return;
}

updateStats(data||[]);
renderProducts(data||[]);

}


/* STATS */

function updateStats(products){

document.getElementById("totalProducts").textContent=
products.length;

let stock=products.reduce(
(sum,p)=>sum+Number(p.stock||0),0
);

document.getElementById("totalStock").textContent=stock;

let active=products.filter(
p=>p.is_active===true
).length;

document.getElementById("activeProducts").textContent=active;

}


/* RENDER */

function renderProducts(products){

if(!products.length){
productsList.innerHTML="<p>No products found.</p>";
return;
}

productsList.innerHTML=products.map(p=>{

const image=p.image_url||
"https://via.placeholder.com/300x200?text=QELVIZO";

return `
<div class="product">

<img src="${esc(image)}"
onerror="this.src='https://via.placeholder.com/300x200?text=QELVIZO'">

<div class="product-info">

<div class="product-name">
${esc(p.name)}
</div>

<div>
<span class="price">₹${esc(p.price)}</span>
<span class="mrp">₹${esc(p.mrp)}</span>
</div>

<div class="stock">
Stock: ${esc(p.stock)}
</div>

<div class="stock">
Status: ${p.is_active?"Active":"Inactive"}
</div>

<p>${esc(p.description||"")}</p>

<div class="actions">

<button class="secondary"
onclick="editProduct('${p.id}')">
Edit
</button>

<button class="success"
onclick="toggleProduct('${p.id}',${p.is_active})">
${p.is_active?"Disable":"Enable"}
</button>

<button class="danger"
onclick="deleteProduct('${p.id}')">
Delete
</button>

</div>

</div>
</div>
`;

}).join("");

}


/* UPLOAD IMAGE */

async function uploadImage(file,userId){

const extension=file.name.split(".").pop().toLowerCase();

const fileName=
Date.now()+"-"+Math.random().toString(36).substring(2,9)
+"."+extension;

const filePath=
userId+"/"+fileName;

const {error}=await db.storage
.from("product-images")
.upload(filePath,file,{
cacheControl:"3600",
upsert:false
});

if(error){
throw error;
}

const {data}=db.storage
.from("product-images")
.getPublicUrl(filePath);

return data.publicUrl;

}


/* SAVE PRODUCT */

saveBtn.addEventListener("click",async()=>{

hideMessage(productMessage);

const name=productName.value.trim();
const description=productDescription.value.trim();
const price=Number(productPrice.value);
const mrp=Number(productMrp.value);
const stock=Number(productStock.value);

if(!name){
message(productMessage,"Product name required hai.","error");
return;
}

if(isNaN(price)||price<0){
message(productMessage,"Valid selling price enter karein.","error");
return;
}

if(isNaN(mrp)||mrp<0){
message(productMessage,"Valid MRP enter karein.","error");
return;
}

if(isNaN(stock)||stock<0){
message(productMessage,"Valid stock quantity enter karein.","error");
return;
}

saveBtn.disabled=true;
saveBtn.textContent=editingId?"Updating...":"Saving...";

try{

const {
data:{user}
}=await db.auth.getUser();

if(!user){
throw new Error("Owner login session expired. Dobara login karein.");
}

let imageUrl=oldImageUrl;

if(selectedFile){

message(
productMessage,
"Image upload ho rahi hai...",
"ok"
);

imageUrl=await uploadImage(
selectedFile,
user.id
);

}

const productData={
name:name,
description:description||null,
price:price,
mrp:mrp,
image_url:imageUrl||null,
stock:stock,
is_active:true
};

let result;

if(editingId){

result=await db
.from("products")
.update(productData)
.eq("id",editingId);

}else{

result=await db
.from("products")
.insert([productData]);

}

if(result.error){
throw result.error;
}

message(
productMessage,
editingId?
"Product successfully updated!":
"Product successfully added!",
"ok"
);

clearForm();
await loadProducts();

}catch(error){

message(
productMessage,
"Save nahi hua: "+error.message,
"error"
);

}

saveBtn.disabled=false;
saveBtn.textContent="Save Product";

});


/* EDIT */

window.editProduct=async function(id){

const {data,error}=await db
.from("products")
.select("*")
.eq("id",id)
.single();

if(error){
alert(error.message);
return;
}

editingId=id;
oldImageUrl=data.image_url||null;

productName.value=data.name||"";
productPrice.value=data.price??"";
productMrp.value=data.mrp??"";
productStock.value=data.stock??"";
productDescription.value=data.description||"";

selectedFile=null;
productFile.value="";

if(data.image_url){
imagePreview.src=data.image_url;
imagePreview.style.display="block";
}else{
imagePreview.style.display="none";
}

document.getElementById("formTitle").textContent=
"Edit Product";

saveBtn.textContent="Update Product";

cancelBtn.classList.remove("hidden");

window.scrollTo({
top:0,
behavior:"smooth"
});

};


/* CANCEL */

cancelBtn.addEventListener("click",clearForm);

function clearForm(){

editingId=null;
oldImageUrl=null;
selectedFile=null;

productName.value="";
productPrice.value="";
productMrp.value="";
productStock.value="";
productDescription.value="";
productFile.value="";

imagePreview.src="";
imagePreview.style.display="none";

document.getElementById("formTitle").textContent=
"Add Product";

saveBtn.textContent="Save Product";

cancelBtn.classList.add("hidden");

}


/* TOGGLE */

window.toggleProduct=async function(id,status){

const {error}=await db
.from("products")
.update({is_active:!status})
.eq("id",id);

if(error){
alert(error.message);
return;
}

loadProducts();

};


/* DELETE */

window.deleteProduct=async function(id){

if(!confirm("Kya aap ye product delete karna chahte hain?")){
return;
}

const {error}=await db
.from("products")
.delete()
.eq("id",id);

if(error){
alert(error.message);
return;
}

loadProducts();

};


/* LOGOUT */

logoutBtn.addEventListener("click",async()=>{

await db.auth.signOut();

dashboard.classList.add("hidden");
loginBox.classList.remove("hidden");

clearForm();

});


checkSession();

</script>
</body>
</html>
